plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

repositories {
    mavenCentral()
    // Mekanism publishes its own 1.20.1 builds (1.20.1-10.4.x) to its maven.
    maven {
        name = 'Mekanism'
        url = 'https://modmaven.dev'
        content {
            includeGroup 'mekanism'
        }
    }
    // Fallback for any CurseForge-only mod dependency.
    maven {
        name = 'CurseForge'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"
    // Mekanism 10.4.16 for Minecraft 1.20.1 (Forge build; verified from its META-INF/mods.toml).
    compileOnly fg.deobf('mekanism:Mekanism:1.20.1-10.4.16.80')
    runtimeOnly fg.deobf('mekanism:Mekanism:1.20.1-10.4.16.80')
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run-test-client')
            args '--quickPlayMultiplayer', '127.0.0.1:25566', '--width', '1280', '--height', '720'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run-test-server')
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            mekanism_version_range: mekanism_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // LGPL-3.0: ship the license text and the GregTech texture attribution in the jar.
    from(rootProject.file('LICENSE'))
    from(rootProject.file('NOTICE'))
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ForgeGradle creates the run tasks lazily; forward the console so scripts can drive them.
tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}
