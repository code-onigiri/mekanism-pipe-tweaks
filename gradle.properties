# --- Gradle -----------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false
systemProp.java.net.preferIPv4Stack=true

# --- Environment --------------------------------------------------------------
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neoforge_version=21.1.264
neoforge_version_range=[21.1.0,)
loader_version_range=[4,)

# --- Mod metadata (expanded into META-INF/neoforge.mods.toml) -----------------
mod_id=mekanism_pipe_tweaks
mod_name=Mekanism Pipe Tweaks
mod_group_id=dev.codeonigiri.mekanism_pipe_tweaks
mod_version=0.2.1
mod_license=LGPL-3.0-only
mod_authors=codeonigiri
mod_description=GregTech-style placement and connection behaviour for all Mekanism pipes, cables, tubes, conductors and transporters (including transmitters added by other addons): a placed transmitter starts disconnected and connects only toward the clicked block when placed while sneaking, with a GT-style sided grid guide for the Configurator.

